<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>열평형 실험 · 교사 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#181128; --bg2:#221833; --card:#291E3D; --card2:#31254A; --line:#443463;
  --ink:#F1ECF9; --muted:#A99CC4;
  --hot:#FF7A45; --cold:#59A8FF; --warn:#FF6B87; --ok:#46D6A0; --gold:#E8B84B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15.5px;line-height:1.55;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
header{background:var(--bg2);border-bottom:1px solid var(--line);margin-bottom:22px}
.hin{max-width:1180px;margin:0 auto;padding:16px 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hin h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.hin .sub{color:var(--muted);font-size:13.5px}
.hin .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
h2{margin:0 0 6px;font-size:18px;font-weight:800}
p.lead{margin:0 0 18px;color:var(--muted);font-size:14px}
label.f{display:block;font-size:13px;font-weight:700;color:#CFC3E6;margin-bottom:6px}
input,select{font:inherit;color:var(--ink);background:#1F1730;border:1.5px solid var(--line);
  border-radius:10px;padding:10px 12px;width:100%}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;border:1.5px solid var(--gold);
  background:var(--gold);color:#1A1226;padding:9px 18px}
button.ghost{background:transparent;color:#D8CFEA;border-color:var(--line)}
button.small{padding:6px 12px;font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:16px}

.msg{border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600;display:none;margin-top:12px}
.msg.on{display:block}
.msg.warn{background:#3A1F2C;color:var(--warn);border:1.5px solid #7A3550}
.msg.ok{background:#16352E;color:var(--ok);border:1.5px solid #2E6A57}
.msg.info{background:#372B1E;color:var(--gold);border:1.5px solid #6E5730}

/* 제출 현황 격자 */
.matrix{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-size:13.5px}
th{background:#2F2447;font-weight:700}
td.cell{cursor:pointer}
td.yes{background:#1B4438;color:#8FEBC8;font-weight:700}
td.no{background:#2B2038;color:#6E6188}
td.cell:hover{outline:2px solid var(--gold);outline-offset:-2px}
th.rowh{background:#382B52;text-align:left;padding-left:12px;white-space:nowrap}

/* 모둠 목록 */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:6px}
.gcard{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--card2);cursor:pointer}
.gcard.miss{opacity:.55;cursor:default;border-style:dashed}
.gcard.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,184,75,.25)}
.gcard .g{font-size:16px;font-weight:800}
.gcard .t{font-size:12.5px;color:var(--muted)}
.gcard .eq{font-size:13.5px;font-weight:700;color:var(--gold);margin-top:6px}
.gcard .names{font-size:12.5px;color:#C7BCDF;margin-top:4px;line-height:1.4}

/* 상세 */
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:18px;align-items:start}
.plot{background:#1E1731;border:1px solid var(--line);border-radius:12px;padding:6px}
svg{display:block;width:100%;height:auto}
.gridline{stroke:#382B52;stroke-width:1}
.axis{stroke:#7E6FA3;stroke-width:1.5}
.axlabel{fill:#A99CC4;font-size:11px}
.axtitle{fill:#E7DFF7;font-size:12px;font-weight:700}
.ch{fill:none;stroke:var(--hot);stroke-width:2.5}
.cc{fill:none;stroke:var(--cold);stroke-width:2.5}
.ansbox{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card2);margin-bottom:10px}
.ansbox .k{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
.ansbox .v{font-size:14px}
tr.hotrow th.rowh{color:var(--hot)} tr.coldrow th.rowh{color:var(--cold)}
.small{font-size:13px;color:var(--muted)}
@media (max-width:900px){.detail{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="hin">
    <h1>열평형 실험 · 교사 대시보드</h1>
    <span class="sub">모둠별 기록 확인</span>
    <span class="right" id="topRight"></span>
  </div>
</header>

<div class="wrap">

<section class="card" id="s-auth">
  <h2>비밀번호를 입력하세요</h2>
  <p class="lead">비밀번호는 이 파일이 아니라 앱스크립트 서버에서 확인합니다.</p>
  <div style="max-width:320px">
    <label class="f" for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
  </div>
  <div class="row"><button id="btnAuth">들어가기</button></div>
  <div class="msg warn" id="authMsg"></div>
</section>

<section class="card" id="s-overview" style="display:none">
  <h2>전체 제출 현황</h2>
  <p class="lead">칸을 누르면 그 모둠 기록으로 바로 갑니다. 초록은 제출 완료입니다.</p>
  <div class="matrix"><table id="mtx"></table></div>
</section>

<section class="card" id="s-class" style="display:none">
  <div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
    <div style="width:140px"><label class="f" for="selClass">반 선택</label><select id="selClass"></select></div>
    <button class="ghost small" id="btnCsv">CSV로 내려받기</button>
    <span class="small" id="clsStat"></span>
  </div>
  <div class="glist" id="glist" style="margin-top:16px"></div>
</section>

<section class="card" id="s-detail" style="display:none"></section>

</div>

<script>
"use strict";
/* 앱스크립트 배포 주소를 여기에 붙여 넣으세요. 비밀번호는 절대 여기 적지 마세요. */
const GAS_URL = "https://script.google.com/macros/s/AKfycbyDVomZMZ3Gl21ONlkY9KMrQMiD97DcpPWb1PywrNUVKrWZOfKZ532z6Ynt3pNsoZyr/exec";

const $=s=>document.querySelector(s);
let PW="", ROWS=[], LATEST={}, curClass=1, curKey=null;

/* ---------- 로그인 ---------- */
$("#btnAuth").onclick=auth;
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter") auth();});

async function auth(){
  const m=$("#authMsg"), pw=$("#pw").value;
  if(!GAS_URL){ m.className="msg warn on"; m.textContent="GAS_URL이 비어 있습니다. 앱스크립트 주소를 먼저 넣어 주세요."; return; }
  if(!pw){ m.className="msg warn on"; m.textContent="비밀번호를 입력하세요."; return; }
  m.className="msg info on"; m.textContent="확인하는 중…";
  try{
    const data=await call(pw);
    if(!data.ok){
      m.className="msg warn on";
      m.textContent = data.error==="PW" ? "비밀번호가 맞지 않습니다." : ("불러오지 못했습니다: "+data.error);
      return;
    }
    PW=pw; $("#pw").value="";
    m.classList.remove("on");
    $("#s-auth").style.display="none";
    $("#topRight").innerHTML=`<button class="ghost small" id="btnReload">새로고침</button>`;
    $("#btnReload").onclick=reload;
    ingest(data.rows); render();
  }catch(err){
    m.className="msg warn on"; m.textContent="연결하지 못했습니다. 주소와 인터넷 연결을 확인하세요.";
  }
}
async function call(pw){
  const res=await fetch(GAS_URL,{method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"list",pw:pw})});
  return await res.json();
}
async function reload(){
  const btn=$("#btnReload"); btn.textContent="불러오는 중…";
  try{ const d=await call(PW); if(d.ok){ ingest(d.rows); render(); } }
  catch(e){}
  btn.textContent="새로고침";
}

/* ---------- 자료 정리 ---------- */
function ingest(rows){
  ROWS=rows||[];
  LATEST={};
  ROWS.forEach(r=>{ LATEST[r.cls+"-"+r.grp]=r; });   // 뒤에 온 것이 최종
}
function render(){
  $("#s-overview").style.display=""; $("#s-class").style.display="";
  buildMatrix(); buildClassSel(); renderClass();
}

/* ---------- 전체 현황 ---------- */
function buildMatrix(){
  let h=`<thead><tr><th class="rowh">반 \\ 모둠</th>`;
  for(let g=1;g<=8;g++) h+=`<th>${g}모둠</th>`;
  h+=`<th>제출</th></tr></thead><tbody>`;
  for(let c=1;c<=11;c++){
    let n=0; h+=`<tr><th class="rowh">${c}반</th>`;
    for(let g=1;g<=8;g++){
      const r=LATEST[c+"-"+g];
      if(r) n++;
      h+=`<td class="cell ${r?"yes":"no"}" data-c="${c}" data-g="${g}">${r?"○":"·"}</td>`;
    }
    h+=`<td>${n} / 8</td></tr>`;
  }
  $("#mtx").innerHTML=h+`</tbody>`;
  document.querySelectorAll("#mtx td.cell").forEach(td=>{
    td.onclick=()=>{
      const c=+td.dataset.c, g=+td.dataset.g;
      curClass=c; $("#selClass").value=c; renderClass();
      if(LATEST[c+"-"+g]) openDetail(c,g);
      else { $("#s-detail").style.display="none"; }
      $("#s-class").scrollIntoView({behavior:"smooth",block:"start"});
    };
  });
}

/* ---------- 반별 목록 ---------- */
function buildClassSel(){
  const s=$("#selClass");
  if(!s.dataset.built){
    for(let i=1;i<=11;i++) s.add(new Option(i+"반",i));
    s.dataset.built="1";
    s.onchange=()=>{ curClass=+s.value; $("#s-detail").style.display="none"; renderClass(); };
  }
  s.value=curClass;
}
function renderClass(){
  const box=$("#glist"); let done=0, h="";
  for(let g=1;g<=8;g++){
    const r=LATEST[curClass+"-"+g];
    if(r){
      done++;
      const nm=k=>`${r.roles[k][0]}번 ${r.roles[k][1]}`;
      h+=`<div class="gcard ${curKey===curClass+"-"+g?"sel":""}" data-g="${g}">
        <div class="g">${g}모둠</div>
        <div class="t">제출 ${r.ts}</div>
        <div class="eq">열평형 ${r.eq!=null?r.eq.toFixed(1):"-"} °C · 학생 답 ${r.a4} °C</div>
        <div class="names">1분이 ${nm("min")} · 뜨거왕 ${nm("hot")}<br>차가왕 ${nm("cold")} · 기록왕 ${nm("rec")}</div>
      </div>`;
    }else{
      h+=`<div class="gcard miss"><div class="g">${g}모둠</div><div class="t">아직 제출하지 않음</div></div>`;
    }
  }
  box.innerHTML=h;
  $("#clsStat").textContent=`${curClass}반 · ${done} / 8 모둠 제출`;
  box.querySelectorAll(".gcard[data-g]").forEach(c=>{
    c.onclick=()=>openDetail(curClass,+c.dataset.g);
  });
}

/* ---------- 상세 ---------- */
function openDetail(c,g){
  const r=LATEST[c+"-"+g]; if(!r) return;
  curKey=c+"-"+g; renderClass();
  const nm=k=>`${r.roles[k][0]}번 ${r.roles[k][1]}`;
  let tbl=`<table style="min-width:640px"><thead><tr><th class="rowh">시간</th>`;
  for(let t=0;t<10;t++) tbl+=`<th>${t}분</th>`;
  tbl+=`</tr></thead><tbody><tr class="hotrow"><th class="rowh">뜨거운 물</th>`;
  for(let t=0;t<10;t++) tbl+=`<td>${fmt(r.hot[t])}</td>`;
  tbl+=`</tr><tr class="coldrow"><th class="rowh">찬물</th>`;
  for(let t=0;t<10;t++) tbl+=`<td>${fmt(r.cold[t])}</td>`;
  tbl+=`</tr><tr><th class="rowh">온도 차</th>`;
  for(let t=0;t<10;t++) tbl+=`<td>${(r.hot[t]!=null&&r.cold[t]!=null)?Math.abs(r.hot[t]-r.cold[t]).toFixed(1):"-"}</td>`;
  tbl+=`</tr></tbody></table>`;

  $("#s-detail").style.display="";
  $("#s-detail").innerHTML=`
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px">
      <h2 style="margin:0">${c}반 ${g}모둠</h2>
      <span class="small">제출 ${r.ts}</span>
      <span class="right" style="margin-left:auto"><button class="ghost small" id="btnClose">닫기</button></span>
    </div>
    <div class="small" style="margin-bottom:14px">
      1분이 ${nm("min")} · 뜨거왕 ${nm("hot")} · 차가왕 ${nm("cold")} · 기록왕 ${nm("rec")}
    </div>
    <div class="detail">
      <div>
        <div class="plot">${chart(r)}</div>
        <div style="overflow-x:auto;margin-top:12px">${tbl}</div>
      </div>
      <div>
        <div class="ansbox"><div class="k">1번 · 뜨거운 물의 온도 변화</div><div class="v">${esc(r.a1h)}</div></div>
        <div class="ansbox"><div class="k">1번 · 찬물의 온도 변화</div><div class="v">${esc(r.a1c)}</div></div>
        <div class="ansbox"><div class="k">2번 · 온도가 같아진 상태</div><div class="v">${esc(r.a2)}</div></div>
        <div class="ansbox"><div class="k">3번 · 오차 원인</div><div class="v">${esc(r.a3)}</div></div>
        <div class="ansbox"><div class="k">4번 · 열평형 온도</div>
          <div class="v">${esc(r.a4)} °C <span class="small">(두 온도가 가장 가까워진 때의 평균 ${r.eq!=null?r.eq.toFixed(1):"-"} °C)</span></div></div>
      </div>
    </div>`;
  $("#btnClose").onclick=()=>{ $("#s-detail").style.display="none"; curKey=null; renderClass(); };
  $("#s-detail").scrollIntoView({behavior:"smooth",block:"start"});
}
const fmt=v=>v==null?"-":v.toFixed(1);
const esc=s=>String(s==null?"":s).replace(/[<>&]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]));

function chart(r){
  const W=560,H=340,PL=48,PR=16,PT=16,PB=42,PW=W-PL-PR,PH=H-PT-PB;
  const vals=r.hot.concat(r.cold).filter(v=>v!=null);
  if(!vals.length) return `<div class="small" style="padding:20px">온도 자료가 없습니다.</div>`;
  let lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  const pad=Math.max(2,(hi-lo)*0.15); lo-=pad; hi+=pad;
  const span=hi-lo, step= span<=16?2 : span<=40?5 : 10;
  const yMin=Math.max(0,Math.floor(lo/step)*step), yMax=Math.min(105,Math.ceil(hi/step)*step);
  const X=t=>PL+(t/9.5)*PW, Y=v=>PT+(yMax-v)/(yMax-yMin)*PH;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let t=0;t<10;t++) s+=`<line class="gridline" x1="${X(t)}" y1="${PT}" x2="${X(t)}" y2="${PT+PH}"/>`;
  for(let v=yMin;v<=yMax+.001;v+=step) s+=`<line class="gridline" x1="${PL}" y1="${Y(v)}" x2="${PL+PW}" y2="${Y(v)}"/>`;
  s+=`<line class="axis" x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+PH}"/>`;
  s+=`<line class="axis" x1="${PL}" y1="${PT+PH}" x2="${PL+PW}" y2="${PT+PH}"/>`;
  for(let t=0;t<10;t++) s+=`<text class="axlabel" x="${X(t)}" y="${PT+PH+16}" text-anchor="middle">${t}</text>`;
  for(let v=yMin;v<=yMax+.001;v+=step) s+=`<text class="axlabel" x="${PL-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  s+=`<text class="axtitle" x="${PL+PW/2}" y="${PT+PH+36}" text-anchor="middle">시간 (분)</text>`;
  s+=`<text class="axtitle" x="14" y="${PT+PH/2}" text-anchor="middle" transform="rotate(-90 14 ${PT+PH/2})">온도 (°C)</text>`;
  ["hot","cold"].forEach(k=>{
    const arr=r[k], pts=[];
    for(let t=0;t<10;t++) if(arr[t]!=null) pts.push({x:X(t),y:Y(arr[t])});
    if(pts.length>1) s+=`<path class="${k==="hot"?"ch":"cc"}" d="${smooth(pts)}"/>`;
    pts.forEach(p=>{ s+=`<circle cx="${p.x}" cy="${p.y}" r="3.6" fill="${k==="hot"?"#FF7A45":"#59A8FF"}"/>`; });
  });
  s+=`<circle cx="${PL+PW-96}" cy="${PT+12}" r="4" fill="#FF7A45"/><text class="axlabel" x="${PL+PW-86}" y="${PT+16}">뜨거운 물</text>`;
  s+=`<circle cx="${PL+PW-96}" cy="${PT+30}" r="4" fill="#59A8FF"/><text class="axlabel" x="${PL+PW-86}" y="${PT+34}">찬물</text>`;
  return s+`</svg>`;
}
function smooth(p){
  let d=`M ${p[0].x.toFixed(1)} ${p[0].y.toFixed(1)}`;
  for(let i=0;i<p.length-1;i++){
    const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;
    d+=` C ${(b.x+(c.x-a.x)/6).toFixed(1)} ${(b.y+(c.y-a.y)/6).toFixed(1)}, ${(c.x-(e.x-b.x)/6).toFixed(1)} ${(c.y-(e.y-b.y)/6).toFixed(1)}, ${c.x.toFixed(1)} ${c.y.toFixed(1)}`;
  }
  return d;
}

/* ---------- CSV ---------- */
$("#btnCsv").onclick=()=>{
  let head=["반","모둠","제출시각","1분이","뜨거왕","차가왕","기록왕"];
  for(let t=0;t<10;t++) head.push("뜨거운물"+t+"분");
  for(let t=0;t<10;t++) head.push("찬물"+t+"분");
  head=head.concat(["1번뜨거운물","1번찬물","2번","3번","4번","계산열평형"]);
  const lines=[head.join(",")];
  for(let g=1;g<=8;g++){
    const r=LATEST[curClass+"-"+g]; if(!r) continue;
    const nm=k=>`${r.roles[k][0]}번 ${r.roles[k][1]}`;
    let a=[r.cls,r.grp,r.ts,nm("min"),nm("hot"),nm("cold"),nm("rec")];
    for(let t=0;t<10;t++) a.push(r.hot[t]);
    for(let t=0;t<10;t++) a.push(r.cold[t]);
    a=a.concat([r.a1h,r.a1c,r.a2,r.a3,r.a4,r.eq]);
    lines.push(a.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(","));
  }
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`열평형_${curClass}반.csv`; a.click();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
